# Cursor / AgentTest 挂载示例（复制到 Host 的 mcp 配置）
#
# 注意：不要写入 capabilities.attach_to（planAgent / behaviorAgent）

name: memory
enabled: true
description: "长效事实记忆；Host 钩子 store/retrieve"
transport: stdio
command: "C:\\DATA\\GODATA\\AgentTestMemoryMCP\\memory-mcp.exe"
args:
  - "-engine"
  - "factworld"
env:
  MEMORY_MCP_DATA_DIR: "C:\\DATA\\GODATA\\AgentTestMemoryMCP\\data"
  # MEMORY_MCP_ENGINE: factworld   # 与 -engine factworld 等价
  # Phase-2c LLM 抽取（未配置 API 时自动回退 rules）
  MEMORY_MCP_LLM_EXTRACT: "1"
  # MEMORY_MCP_LLM_API_BASE: "https://api.openai.com/v1"
  # MEMORY_MCP_LLM_API_KEY: "sk-..."
  # MEMORY_MCP_LLM_MODEL: "gpt-4o-mini"
  # MEMORY_MCP_LLM_EXTRACT: "0"   # 强制关闭 LLM，仅用规则抽取
  # Phase-2d 退化与对齐
  # MEMORY_MCP_ENTITY_MERGE_COSINE: "0.92"
  # MEMORY_MCP_ENTITY_FUZZY_LOW: "0.85"
  # MEMORY_MCP_ENTITY_ALIGN_ASYNC: "1"
  # MEMORY_MCP_ENTITY_ALIGN_MIN_ACCESS: "2"
  # MEMORY_MCP_SUPERSEDE_FACTOR: "0.2"
  # MEMORY_MCP_STALE_DAYS: "30"
#  MEMORY_MCP_L2_CONFLICT: "1"          # 可选；不写默认也是开
#  MEMORY_MCP_L2_MIN_OLD_WEIGHT: "0.5"
#  MEMORY_MCP_L2_MAX_CANDIDATES: "3"
#  MEMORY_MCP_L2_TIMEOUT_MS: "15000"
#  MEMORY_MCP_L2_TOPIC_JACCARD: "0.3"
