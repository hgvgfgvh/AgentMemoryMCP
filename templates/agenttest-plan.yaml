id: agenttest-plan
source_match: agenttest-plan
description: AgentTest Plan 编排 episode 结构化抽取模板

sections:
  - 用户诉求
  - 门户回复
  - 计划终态 (TodoList)
  - 计划终态

predicates:
  - uses
  - triggers
  - caused_by
  - depends_on
  - produces
  - supersedes
  - pitfall
  - similar

node_types:
  - ENTITY
  - ACTION
  - STATE
  - CONCEPT

pitfall_statuses:
  - failed
  - fail
  - blocked

prompt_rules: |
  - 名词实体 → ENTITY；行为 → ACTION；结果/错误 → STATE；配置/模式 → CONCEPT
  - predicate 只能从枚举列表选择
  - tools 与 artifacts 不得超出预解析列表
  - 每条 atom 必须带 evidence，且为 episode 原文摘录（可截断至 300 字）
  - summary.text 用中文，格式类似：历史需求: ... 结果: ... 工具: ...
